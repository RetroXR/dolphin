# Build the retroXR Dolphin core for Windows, Android, Linux and macOS and
# publish it as a release, so retroXR's CoreDownloadManager can fetch it.
#
# The existing build-*-libretro.yml workflows compile on every push and keep
# nothing. That makes them fine as checks and useless as a source of binaries,
# which is why every release before this one was built by hand on a desktop.
# This runs the SAME configure and build commands they do -- deliberately copied
# rather than shared, so a change to a check cannot silently change what ships.
#
# The contract with the app is narrow and entirely in the asset names. RetroXR
# reads CoreSources.SOURCES["dolphin"].assets and asks for exactly one filename
# per platform; a miss is reported as a miss rather than falling back, so a
# renamed asset here is a core that simply never downloads.
#
#   Windows  dolphin_libretro.dll.zip          containing dolphin_libretro.dll
#   Android  dolphin_libretro_android.so.zip   containing dolphin_libretro_android.so
#   Linux    dolphin_libretro.so.zip           containing dolphin_libretro.so
#   macOS    dolphin_libretro_arm64.dylib.zip
#            dolphin_libretro_x86_64.dylib.zip each containing dolphin_libretro.dylib
#
# One core file at the root of the zip, which is what the previous hand-built
# assets contained and what the installer unpacks.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so that shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease for the
# same reason -- `latest` is per repository, not per product.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-dolphin-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

env:
  core_id: dolphin_libretro

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: choco install cmake ninja git

      - uses: actions/checkout@v6
        with:
          path: ${{ env.core_id }}
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure (MSVC)
        run: |
          cd ${{ env.core_id }}
          mkdir build && cd build
          cmake .. -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build ${{ env.core_id }}/build --config Release --parallel

      # Located rather than assumed: the output path moves with the generator and
      # with Dolphin's own layout, and a wrong guess here fails as an empty zip
      # that uploads perfectly well.
      - name: Package
        shell: pwsh
        run: |
          $hits = @(Get-ChildItem -Path "${{ env.core_id }}/build" -Recurse -Filter "dolphin_libretro.dll" -File)
          if ($hits.Count -ne 1) {
            Write-Host "expected exactly one dolphin_libretro.dll, found $($hits.Count):"
            $hits | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item $hits[0].FullName stage/dolphin_libretro.dll
          Compress-Archive -Path stage/dolphin_libretro.dll -DestinationPath dolphin_libretro.dll.zip -Force
          Write-Host "packaged $([math]::Round($hits[0].Length/1MB,1)) MB core"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dolphin_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-25-jdk wget unzip cmake ninja-build
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          path: ${{ env.core_id }}
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure
        run: |
          cd ${{ env.core_id }}
          cmake -B build/android-arm64-v8a \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -G Ninja

      - name: Build
        run: |
          cd ${{ env.core_id }}/build/android-arm64-v8a
          ninja -j$(nproc)

      # The core is renamed to the _android spelling on the way into the zip.
      # CoreDownloadManager.core_lib_suffixes() accepts both on Android, but the
      # canonical name is the one the asset advertises, and matching it keeps a
      # downloaded core recognisable as the one that was asked for.
      - name: Package
        run: |
          mapfile -t hits < <(find "${{ env.core_id }}/build/android-arm64-v8a" \
            -name 'dolphin_libretro*.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one dolphin_libretro*.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/dolphin_libretro_android.so

          # Strip, because CMake does not and nothing downstream will. Unstripped
          # this core is 230 MB of which 215 MB is debug_info, and it is
          # downloaded onto a headset at runtime and kept in internal storage.
          # Stripped it is 15 MB. (ndk-build strips on install, which is why the
          # Makefile-based cores never needed this and these two do.)
          #
          # --strip-unneeded and not --strip-all: the frontend finds this core by
          # dlsym, so removing the dynamic symbol table would leave a core that
          # downloads, installs, and cannot be loaded at all.
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          before=$(stat -c%s stage/dolphin_libretro_android.so)
          "$STRIP" --strip-unneeded stage/dolphin_libretro_android.so
          after=$(stat -c%s stage/dolphin_libretro_android.so)
          echo "stripped: $before -> $after bytes"

          # And prove the entry points survived it, rather than assuming. A core
          # missing these is indistinguishable from a failed download to anyone
          # looking at the app.
          exports=$("$NM" --dynamic --defined-only stage/dolphin_libretro_android.so \
            | grep -c ' retro_' || true)
          echo "retro_* exports after stripping: $exports"
          for sym in retro_api_version retro_init retro_load_game retro_run; do
            if ! "$NM" --dynamic --defined-only stage/dolphin_libretro_android.so \
                 | grep -q " $sym\$"; then
              echo "FATAL: $sym is not exported after stripping"
              exit 1
            fi
          done

          (cd stage && zip -q -X ../dolphin_libretro_android.so.zip dolphin_libretro_android.so)
          ls -lh dolphin_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dolphin_libretro_android.so.zip
          if-no-files-found: error

  # The oldest Ubuntu runner: a shared library loads only against a glibc at
  # least as new as the one it was linked with. Dolphin wants GCC 12 and its
  # libstdc++, which 22.04 has as a package but not as its default compiler.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      # Only what the core cannot take from Externals/: X11, udev (the hardware
      # database is a hard requirement once enabled) and the GL/EGL headers. No
      # cmake from apt -- 22.04's is 3.22 and Dolphin needs 3.25; the runner
      # image's own newer one is already first on PATH.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 ninja-build pkg-config zip \
            libx11-dev libxi-dev libxrandr-dev libudev-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - uses: actions/checkout@v6
        with:
          path: ${{ env.core_id }}
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # USE_SYSTEM_LIBS=OFF, unlike build-ubuntu-libretro.yml, which links the
      # runner's mbedtls, curl and zlib. That is fine for a build check and wrong
      # for a download: libmbedcrypto.so.7 is an Ubuntu 22.04 soname, and a core
      # that names it will not load on a distro that ships another. Bundled, the
      # only libraries left are ones every desktop Linux has.
      - name: Configure
        run: |
          cd ${{ env.core_id }}
          cmake -B build/linux-x86_64 \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LIBS=OFF \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -G Ninja

      - name: Build
        run: ninja -C ${{ env.core_id }}/build/linux-x86_64 -j$(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find "${{ env.core_id }}/build/linux-x86_64" \
            -name 'dolphin_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one dolphin_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          lib=stage/dolphin_libretro.so
          cp "${hits[0]}" "$lib"

          # --strip-unneeded for the same reason as Android: the frontend finds
          # the core by dlsym, so the dynamic symbol table has to survive.
          before=$(stat -c%s "$lib")
          strip --strip-unneeded "$lib"
          echo "stripped: $before -> $(stat -c%s "$lib") bytes"
          # Listed once into a variable: `nm | grep -q` under pipefail fails
          # whenever grep's early exit kills nm with SIGPIPE mid-table.
          exports=$(nm --dynamic --defined-only "$lib")
          for sym in retro_api_version retro_init retro_load_game retro_run; do
            if ! grep -q " $sym\$" <<<"$exports"; then
              echo "FATAL: $sym is not exported after stripping"
              exit 1
            fi
          done

          # Every library the core names must be one a desktop has anyway. A
          # new entry here is a dependency that crept in from the runner.
          readelf -d "$lib" | grep NEEDED
          unexpected=$(readelf -d "$lib" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' \
            | grep -Ev '^(libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s|ld-linux-x86-64|libX11|libXi|libXrandr|libXext|libudev|libEGL|libGL|libGLX|libOpenGL)\.so' || true)
          if [ -n "$unexpected" ]; then
            echo "FATAL: unexpected shared library dependencies:"
            echo "$unexpected"
            exit 1
          fi

          # And the glibc and libstdc++ floors are still 22.04's (2.35, and
          # GCC 12's 3.4.30). The runner carries a newer libstdc++ than the
          # distro does, and a symbol bound to it would not load on 22.04 itself.
          glibc=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          glibcxx=$(objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          echo "newest symbol versions: $glibc $glibcxx"
          if [ "$(printf '%s\n' "$glibc" GLIBC_2.35 | sort -V | tail -1)" != GLIBC_2.35 ] ||
             [ "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.30 | sort -V | tail -1)" != GLIBCXX_3.4.30 ]; then
            echo "FATAL: the core needs a newer glibc or libstdc++ than Ubuntu 22.04's"
            exit 1
          fi

          (cd stage && zip -q -X ../dolphin_libretro.so.zip dolphin_libretro.so)
          file "$lib"
          ls -lh dolphin_libretro.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dolphin_libretro.so.zip
          if-no-files-found: error

  # Both architectures on one Apple Silicon runner, with the arguments libretro's
  # own .gitlab-ci.yml passes for its osx-x64 job, which also runs on Apple
  # Silicon: CMAKE_SYSTEM_NAME and _PROCESSOR make it a cross build, so Dolphin's
  # architecture detection (and every external's) sees x86_64 rather than the
  # host. LIBRETRO on APPLE already forces every library to the bundled copy, so
  # nothing is taken from Homebrew.
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cross: ''
          - arch: x86_64
            cross: '-DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=x86_64'
    steps:
      # The newest Xcode on the image rather than its default, 15.4. Dolphin
      # builds a struct from parentheses (make_unique<Listener>(callback) in
      # HookableEvent.h), which is C++20 aggregate init that Apple clang only
      # accepts from Xcode 16; 15.4 stops at "no matching constructor".
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          clang++ --version

      - name: Install dependencies
        run: brew install ninja

      - uses: actions/checkout@v6
        with:
          path: ${{ env.core_id }}
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure
        run: |
          cd ${{ env.core_id }}
          cmake -B build/macos-${{ matrix.arch }} \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            ${{ matrix.cross }} \
            -G Ninja

      - name: Build
        run: ninja -C ${{ env.core_id }}/build/macos-${{ matrix.arch }} -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          hits=()
          while IFS= read -r f; do hits+=("$f"); done < <(find \
            "${{ env.core_id }}/build/macos-${{ matrix.arch }}" \
            -name 'dolphin_libretro.dylib' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one dolphin_libretro.dylib, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          lib=stage/dolphin_libretro.dylib
          cp "${hits[0]}" "$lib"
          lipo -info "$lib"
          if [ "$(lipo -archs "$lib")" != "${{ matrix.arch }}" ]; then
            echo "$lib is not ${{ matrix.arch }}"
            exit 1
          fi
          # Nothing from Homebrew: a core that names /opt/homebrew or /usr/local
          # loads on the runner and on nobody else's Mac.
          otool -L "$lib"
          if otool -L "$lib" | tail -n +2 | grep -Eq '/opt/homebrew|/usr/local|@rpath'; then
            echo "$lib links a library outside the system"
            exit 1
          fi
          exports=$(nm -gU "$lib")
          for sym in retro_api_version retro_init retro_load_game retro_run; do
            if ! grep -q " _$sym\$" <<<"$exports"; then
              echo "FATAL: $sym is not exported"
              exit 1
            fi
          done
          (cd stage && zip -q -X ../dolphin_libretro_${{ matrix.arch }}.dylib.zip dolphin_libretro.dylib)
          ls -lh dolphin_libretro_${{ matrix.arch }}.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dolphin_libretro_${{ matrix.arch }}.dylib.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android, linux, macos]
    # Only when there is a tag to publish as. A workflow_dispatch with a blank
    # tag is a build check and stops here rather than cutting a release nobody
    # asked for.
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<EOF
          Dolphin libretro core built for retroXR, from \`$GITHUB_SHA\`.

          Windows x86_64, Android arm64-v8a, Linux x86_64 and macOS arm64 and
          x86_64. The source for these binaries is this tag, which is how the
          GPLv2+ obligation is met.

          Over the stock buildbot build this adds the options retroXR needs:
          Wiimote IR passthrough, the Wii Remote speaker (handed to the frontend
          per remote through the controller audio interface), per-slot GameCube
          memory cards, deterministic mode, and the frontend link interface. It
          also writes each TEV stage's integer blend so that Qualcomm's Adreno
          driver, which evaluates it in 16 bits, still draws it exactly (New Super
          Mario Bros. Wii's title hills were magenta on a Quest).

          v11: the GameCube Microphone is seated like a memory card, and live. Either memory card path
          option now takes mic, which becomes the Microphone EXI device, so a frontend can plug one in
          or pull it mid-game exactly as it swaps a card. The microphone is polled every frame in
          whichever slot holds it; before this, a microphone enabled from the saved options was never
          polled at all. Its button is read whenever a slot holds a microphone, and the activate
          microphone hotkey now accepts L1 and R1, which it offered but ignored.

          v11 also starts with no content at all, booting the GameCube IPL so the console's own
          menu comes up with nothing in the drive. dolphin_gc_bios_region picks which one; auto
          takes the first installed, USA then EUR then JAP.

          v13 boots the Wii System Menu. dolphin_console (auto, gamecube or wii) says which console an
          empty drive is: wii boots the System Menu installed in the NAND, and is refused rather than
          falling back to the GameCube IPL when there is none; auto keeps the old behaviour. The core
          also exports retroxr_wii_system_update, Dolphin's online system update from NUS, so a
          frontend can install the System Menu without the Wii common key ever leaving Dolphin.
          EOF
          # Create if absent, then upload with --clobber, so re-running the
          # workflow for a tag replaces the assets instead of failing.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dolphin (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/dolphin_libretro.dll.zip \
            dist/dolphin_libretro_android.so.zip \
            dist/dolphin_libretro.so.zip \
            dist/dolphin_libretro_arm64.dylib.zip \
            dist/dolphin_libretro_x86_64.dylib.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
